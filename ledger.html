<!DOCTYPE html>

</head>


<body>

    <!-- Top Header -->

    <header class="topbar">

        <button class="menu-btn">
            ☰
        </button>


        <div class="logo">
            BILLBOOK
        </div>


        <button class="profile-btn">
            ♙

    </header>



    <!-- Main Ledger -->

    <main class="ledger-page">


        <!-- Page Heading -->

        <section class="ledger-heading">

            <h1>
                Master Ledger
            </h1>

            <p>
                A chronological record of your finances.
            </p>

        </section>



        <!-- Search -->

        <section class="ledger-search">

            <input
                type="text"
                id="ledgerSearch"
                placeholder="Search entries..."

        </section>



        <!-- Transactions -->

        <section
            id="ledgerEntries"
            class="ledger-entries"
        >


            <!--
                Transactions will be added here
                using JavaScript.

                They will be grouped according
                to their date.
            -->

    <nav class="bottom-nav">


        <a

            <span class="nav-icon">

            </span>

        <a

            </span>

            <span>

            </span>

            </span>

            <span class="nav-icon">
                ♧
            </span>
